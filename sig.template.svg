<svg xmlns="http://www.w3.org/2000/svg" width="620" height="200" viewBox="0 0 620 200" role="img" aria-label="{{ARIA_LABEL}}">
<style>
  /* One fixed palette, deliberately. This used to carry a
     prefers-color-scheme block, but that media query reports the READER'S OS
     setting, not the theme of the page the signature is posted on, and an SVG
     embedded through [img] can never learn the latter: it renders as an
     isolated document, so page CSS does not inherit into it, scripts do not
     run, and blend modes composite against the SVG's own canvas rather than
     the page behind it. That isolation is a privacy property, not an
     oversight, so it will not change.
     Auto-switching therefore made one signature look different to every
     reader while still not matching the forum. A fixed palette is the same for
     everyone, and dark is the one the club colours were chosen against.

     --accent is the Barracuda cyan and carries everything structural;
     --accent2 is the pink, used only for banked TPE. --onAccent is for text
     riding the solid accent fill, where white would read 1.9 and vanish. */
  :root{
    --bg:#12161c; --panel:#161c24; --rail:#0b0e13; --rule:#28313e; --grid:#222b37; --well:#0b0e13;
    --ink:#eef2f7; --muted:#78849a; --accent:#0ad2d2; --accent2:#f499c2; --onAccent:#0b0e13;
  }
  .bg{fill:var(--bg)} .panel{fill:var(--panel)} .rail{fill:var(--rail)}
  .num{fill:var(--ink); font:700 84px/1 "Arial Narrow","Haettenschweiler",Impact,sans-serif; letter-spacing:-3px}
  .nm{fill:var(--ink); font:700 19px/1 "Arial Narrow",Impact,sans-serif; letter-spacing:3px}
  .pos{fill:var(--accent); font:700 10px/1 Verdana,sans-serif; letter-spacing:3px}
  .meta{fill:var(--muted); font:400 8px/1 Verdana,sans-serif; letter-spacing:1.2px}
  .team{fill:var(--muted); font:700 9px/1 Verdana,sans-serif; letter-spacing:2px}
  .ax{fill:var(--muted); font:700 6.5px/1 Verdana,sans-serif; letter-spacing:1.2px}
  .lbl{fill:var(--muted); font:700 8px/1 Verdana,sans-serif; letter-spacing:1.6px}
  /* The season, set large and faint behind the cards. Deliberately the club's
     second colour at low opacity: the banked TPE segment directly above is the
     same pink at full strength, and keeping this one ghosted is what stops the
     two reading as the same element. It also has to sit under whatever stat
     value lands on top of it without fighting for the same attention. */
  .ghost{fill:var(--accent2); fill-opacity:0.15; letter-spacing:-1px;
         font:700 43.8px/1 "Arial Narrow","Haettenschweiler",Impact,sans-serif}
  .val{fill:var(--ink); font:700 15px/1 Verdana,sans-serif}

  /* the divider IS the bar: full width = 2000 TPE.
     Cyan is applied TPE, pink runs on to the head and is banked, so the head
     itself reads as the total. Banked is deliberately unlabelled; it is the
     gap between the two figures, and naming it would state it twice. */
  .tpeLbl{font:700 9px/1 Verdana,sans-serif; letter-spacing:1px}
  .tpeOn{fill:var(--onAccent)}  /* rides the solid accent, so it inverts with it */
  .tpeInk{fill:var(--ink)}      /* rides the empty track */
  .tpeTotal{ animation: fillTotal 1.2s cubic-bezier(.2,.8,.2,1) .5s both; }
  .tpeApp{ animation: fillApp 1.2s cubic-bezier(.2,.8,.2,1) .75s both; }
  .tpeHead{ animation: headIn .5s ease-out 1.5s both; }
  @keyframes fillTotal{ from{width:0} to{width:{{TPE_TOTAL_PX}}px} }
  @keyframes fillApp{ from{width:0} to{width:{{TPE_APPLIED_PX}}px} }
  @keyframes headIn{ from{opacity:0} to{opacity:1} }

  /* The placement transform lives on the INNER group on purpose. A CSS
     transform here would override the SVG transform attribute rather than
     compose with it, which throws the artwork across the canvas. */
  .mark{ transform-origin:535px 76px; animation: markIn 1s cubic-bezier(.2,.8,.2,1) .45s both; }
  .shape{ transform-origin:338px 78px; animation: bloom 1.1s cubic-bezier(.2,.8,.2,1) .35s both; }
  @keyframes markIn{ from{opacity:0; transform:scale(.94)} to{opacity:1; transform:scale(1)} }
  @keyframes bloom{ from{transform:scale(0); opacity:0} to{transform:scale(1); opacity:1} }

  /* Six regular-season cards, joined by four playoff cards while a run is on
     the books. Each card holds 3.5s either way, so the loop lengthens rather
     than speeding up. build.py writes every timing below from the live card
     count: the percentages are one card's turn expressed against the whole
     loop, so they cannot be hardcoded without breaking the day a card appears. */
  .card{ opacity:0; animation: cycle {{CYCLE_SECONDS}}s ease-in-out infinite; }
  {{CYCLE_DELAYS}}
  @keyframes cycle{
    0%   {opacity:0; transform:translateY(6px)}
    {{CYCLE_IN}}% {opacity:1; transform:translateY(0)}
    {{CYCLE_HOLD}}%{opacity:1; transform:translateY(0)}
    {{CYCLE_OUT}}%{opacity:0; transform:translateY(-6px)}
    100% {opacity:0; transform:translateY(-6px)}
  }
  @media (prefers-reduced-motion: reduce){
    .card{animation:none; opacity:0} .c1{opacity:1}
    .shape{animation:none; transform:none; opacity:1}
    .mark{animation:none; opacity:1}
    .tpeHead{animation:none; opacity:1}
    .tpeTotal{animation:none; width:{{TPE_TOTAL_PX}}px}
    .tpeApp{animation:none; width:{{TPE_APPLIED_PX}}px}
  }
</style>

<rect class="bg" x="0" y="0" width="620" height="200"/>
<rect class="panel" x="0" y="0" width="620" height="152"/>

<!-- COLUMN 1: identity -->
<text class="num"  x="24" y="77">{{NUMBER}}</text>
<text class="nm"   x="26" y="106">{{NAME}}</text>
<text class="pos"  x="27" y="120">{{POSITION}}</text>
<text class="meta" x="27" y="134">{{BIRTHPLACE}}  ·  {{DRAFT_CLASS}} DRAFT</text>
<text class="meta" x="27" y="144">{{HEIGHT}}  ·  {{WEIGHT}} LBS  ·  SHOOTS {{SHOOTS}}</text>

<line stroke="var(--rule)" x1="236" y1="26" x2="236" y2="134"/>

<!-- COLUMN 2: attribute radar, grouped averages on a 0-20 scale -->
<g>
  <polygon fill="none" stroke="var(--grid)" points="338.0,24.0 384.8,51.0 384.8,105.0 338.0,132.0 291.2,105.0 291.2,51.0"/>
  <polygon fill="none" stroke="var(--grid)" points="338.0,51.0 361.4,64.5 361.4,91.5 338.0,105.0 314.6,91.5 314.6,64.5"/>
  <line stroke="var(--grid)" x1="338" y1="78" x2="338.0" y2="24.0"/>
  <line stroke="var(--grid)" x1="338" y1="78" x2="384.8" y2="51.0"/>
  <line stroke="var(--grid)" x1="338" y1="78" x2="384.8" y2="105.0"/>
  <line stroke="var(--grid)" x1="338" y1="78" x2="338.0" y2="132.0"/>
  <line stroke="var(--grid)" x1="338" y1="78" x2="291.2" y2="105.0"/>
  <line stroke="var(--grid)" x1="338" y1="78" x2="291.2" y2="51.0"/>

  <g class="shape">
    <polygon points="{{RADAR_POINTS}}"
             fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)"
             stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="{{RADAR_X1}}" cy="{{RADAR_Y1}}" r="2.2" fill="var(--accent)"/>
    <circle cx="{{RADAR_X2}}" cy="{{RADAR_Y2}}" r="2.2" fill="var(--accent)"/>
    <circle cx="{{RADAR_X3}}" cy="{{RADAR_Y3}}" r="2.2" fill="var(--accent)"/>
    <circle cx="{{RADAR_X4}}" cy="{{RADAR_Y4}}" r="2.2" fill="var(--accent)"/>
    <circle cx="{{RADAR_X5}}" cy="{{RADAR_Y5}}" r="2.2" fill="var(--accent)"/>
    <circle cx="{{RADAR_X6}}" cy="{{RADAR_Y6}}" r="2.2" fill="var(--accent)"/>
  </g>

  <text class="ax" x="338" y="17"  text-anchor="middle">SKATING</text>
  <text class="ax" x="391" y="49"  >SENSE</text>
  <text class="ax" x="391" y="110" >PUCK</text>
  <text class="ax" x="338" y="142" text-anchor="middle">PHYSICAL</text>
  <text class="ax" x="285" y="110" text-anchor="end">STICK</text>
  <text class="ax" x="285" y="49"  text-anchor="end">MENTAL</text>
</g>

<line stroke="var(--rule)" x1="446" y1="26" x2="446" y2="134"/>

<!-- COLUMN 3: the club's lockup, exactly as the league draws it. There is no
     medallion and no separate club name any more: the artwork already carries
     its own wordmark, and setting that beside a text copy of the same words was
     saying it twice. Freed of a ring to fit inside, it can also run about half
     as large again, which is what makes its smaller line legible at all. -->
<g class="mark">
  <g transform="{{MARK_TRANSFORM}}"><!--CLUB_MARK--></g>
</g>

<!-- THE DIVIDER IS THE BAR. Full 620 width = 2000 TPE.
     The dividers at 155/310/465 cut it into four 500-TPE segments. They are
     drawn before the labels on purpose: as the head travels right a label will
     eventually reach one, and passing behind the text beats striking through it. -->
<rect fill="var(--rule)" x="0" y="152" width="620" height="16"/>
<rect class="tpeTotal" fill="var(--accent2)" fill-opacity="0.85" x="0" y="152" width="{{TPE_TOTAL_PX}}" height="16"/>
<rect class="tpeApp" fill="var(--accent)" x="0" y="152" width="{{TPE_APPLIED_PX}}" height="16"/>
<line stroke="var(--bg)" x1="155" y1="152" x2="155" y2="168"/>
<line stroke="var(--bg)" x1="310" y1="152" x2="310" y2="168"/>
<line stroke="var(--bg)" x1="465" y1="152" x2="465" y2="168"/>
<line class="tpeHead" stroke="var(--accent)" x1="{{TPE_HEAD_X}}" y1="150" x2="{{TPE_HEAD_X}}" y2="170"/>
<text class="tpeLbl tpeOn tpeHead"  x="{{TPE_APPLIED_LABEL_X}}" y="163" text-anchor="end">{{TPE_APPLIED_LABEL}}</text>
<text class="tpeLbl tpeInk tpeHead" x="{{TPE_TOTAL_LABEL_X}}" y="163">{{TPE_TOTAL_LABEL}}</text>
<text class="tpeLbl tpeInk tpeHead" x="613" y="163" text-anchor="end" fill-opacity="0.45">{{TPE_SCALE_LABEL}}</text>

<!-- ticker rail. The season is ghosted in behind the cards rather than printed
     under the crest, because it describes these numbers rather than the club.
     Sized so its ink fills the rail's 32px exactly: this face puts all of its
     ink above the baseline, 0.73 of the font size, measured rather than taken
     from a metrics table because the S overshoots its cap height. The clip
     stays as a backstop, since a machine without Arial Narrow falls back to a
     face with different proportions.
     Anchored at 620.9 rather than 620: the anchor positions the advance width,
     and this face insets its ink from that by 0.02em, so the extra 0.9px is
     what actually lands the right edge of the 9 on the edge of the canvas. -->
<rect class="rail" x="0" y="168" width="620" height="32"/>
<clipPath id="rail"><rect x="0" y="168" width="620" height="32"/></clipPath>
<text class="ghost" clip-path="url(#rail)" x="620.9" y="200" text-anchor="end">S{{SEASON}}</text>

<g class="card c1">
  <text class="lbl" x="24"  y="180">GP</text><text class="val" x="24"  y="195">{{ST_GP}}</text>
  <text class="lbl" x="174" y="180">G</text><text class="val" x="174" y="195">{{ST_G}}</text>
  <text class="lbl" x="324" y="180">A</text><text class="val" x="324" y="195">{{ST_A}}</text>
  <text class="lbl" x="474" y="180">PTS</text><text class="val" x="474" y="195">{{ST_P}}</text>
</g>
<g class="card c2">
  <text class="lbl" x="24"  y="180">+/-</text><text class="val" x="24"  y="195">{{ST_PM}}</text>
  <text class="lbl" x="174" y="180">PIM</text><text class="val" x="174" y="195">{{ST_PIM}}</text>
  <text class="lbl" x="324" y="180">SOG</text><text class="val" x="324" y="195">{{ST_SOG}}</text>
  <text class="lbl" x="474" y="180">S%</text><text class="val" x="474" y="195">{{ST_SHPCT}}</text>
</g>
<g class="card c3">
  <text class="lbl" x="24"  y="180">HITS</text><text class="val" x="24"  y="195">{{ST_HITS}}</text>
  <text class="lbl" x="174" y="180">BLK</text><text class="val" x="174" y="195">{{ST_BLK}}</text>
  <text class="lbl" x="324" y="180">TK</text><text class="val" x="324" y="195">{{ST_TK}}</text>
  <text class="lbl" x="474" y="180">TK-GV</text><text class="val" x="474" y="195">{{ST_TKGV}}</text>
</g>
<g class="card c4">
  <text class="lbl" x="24"  y="180">CF%</text><text class="val" x="24"  y="195">{{ST_CF}}</text>
  <text class="lbl" x="174" y="180">FF%</text><text class="val" x="174" y="195">{{ST_FF}}</text>
  <text class="lbl" x="324" y="180">PDO</text><text class="val" x="324" y="195">{{ST_PDO}}</text>
  <text class="lbl" x="474" y="180">ATOI</text><text class="val" x="474" y="195">{{ST_TOIGP}}</text>
</g>
<g class="card c5">
  <text class="lbl" x="24"  y="180">GF/60</text><text class="val" x="24"  y="195">{{ST_GF60}}</text>
  <text class="lbl" x="174" y="180">GA/60</text><text class="val" x="174" y="195">{{ST_GA60}}</text>
  <text class="lbl" x="324" y="180">SF/60</text><text class="val" x="324" y="195">{{ST_SF60}}</text>
  <text class="lbl" x="474" y="180">SA/60</text><text class="val" x="474" y="195">{{ST_SA60}}</text>
</g>
<g class="card c6">
  <text class="lbl" x="24"  y="180">PPP</text><text class="val" x="24"  y="195">{{ST_PPP}}</text>
  <text class="lbl" x="174" y="180">SHP</text><text class="val" x="174" y="195">{{ST_SHP}}</text>
  <text class="lbl" x="324" y="180">PP ATOI</text><text class="val" x="324" y="195">{{ST_PPTOI}}</text>
  <text class="lbl" x="474" y="180">SH ATOI</text><text class="val" x="474" y="195">{{ST_SHTOI}}</text>
</g>
<!--PLAYOFF_CARDS_START-->
<g class="card c7">
  <text class="lbl" x="24"  y="180">PO GP</text><text class="val" x="24"  y="195">{{PO_GP}}</text>
  <text class="lbl" x="174" y="180">PO G</text><text class="val" x="174" y="195">{{PO_G}}</text>
  <text class="lbl" x="324" y="180">PO A</text><text class="val" x="324" y="195">{{PO_A}}</text>
  <text class="lbl" x="474" y="180">PO PTS</text><text class="val" x="474" y="195">{{PO_P}}</text>
</g>
<g class="card c8">
  <text class="lbl" x="24"  y="180">PO +/-</text><text class="val" x="24"  y="195">{{PO_PM}}</text>
  <text class="lbl" x="174" y="180">PO PIM</text><text class="val" x="174" y="195">{{PO_PIM}}</text>
  <text class="lbl" x="324" y="180">PO SOG</text><text class="val" x="324" y="195">{{PO_SOG}}</text>
  <text class="lbl" x="474" y="180">PO S%</text><text class="val" x="474" y="195">{{PO_SHPCT}}</text>
</g>
<g class="card c9">
  <text class="lbl" x="24"  y="180">PO HITS</text><text class="val" x="24"  y="195">{{PO_HITS}}</text>
  <text class="lbl" x="174" y="180">PO BLK</text><text class="val" x="174" y="195">{{PO_BLK}}</text>
  <text class="lbl" x="324" y="180">PO TK</text><text class="val" x="324" y="195">{{PO_TK}}</text>
  <text class="lbl" x="474" y="180">PO TK-GV</text><text class="val" x="474" y="195">{{PO_TKGV}}</text>
</g>
<g class="card c10">
  <text class="lbl" x="24"  y="180">PO PPP</text><text class="val" x="24"  y="195">{{PO_PPP}}</text>
  <text class="lbl" x="174" y="180">PO SHP</text><text class="val" x="174" y="195">{{PO_SHP}}</text>
  <text class="lbl" x="324" y="180">PO PP ATOI</text><text class="val" x="324" y="195">{{PO_PPTOI}}</text>
  <text class="lbl" x="474" y="180">PO SH ATOI</text><text class="val" x="474" y="195">{{PO_SHTOI}}</text>
</g>
<!--PLAYOFF_CARDS_END-->
</svg>
